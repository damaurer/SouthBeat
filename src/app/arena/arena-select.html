<section class="arena-select">
  <header>
    <a routerLink="/">← Zurück</a>
    <h1>Arena wählen</h1>
  </header>

  <div class="stage">
    <app-arena-canvas [arena]="selected()" [fighters]="fighters()" />
    <div class="info">
      <h2>{{ selected().name }}</h2>
      <p>{{ selected().description }}</p>
      <p class="matchup">{{ playerName() }} gegen Sparringspartner</p>
    </div>
  </div>

  <ul class="arena-list">
    @for (arena of arenas; track arena.id) {
      <li>
        <button type="button" (click)="selected.set(arena)" [class.active]="arena.id === selected().id" [attr.aria-pressed]="arena.id === selected().id">
          <app-arena-canvas [arena]="arena" />
          <span>{{ arena.name }}</span>
        </button>
      </li>
    }
  </ul>
</section>
