# Lint, build and every test suite on each push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Browser unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadless
      - name: Server tests
        run: npm run test:server
      - name: Content packs are valid
        run: npm run content -- validate content/examples/*.json
      - name: End-to-end smoke tests
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
